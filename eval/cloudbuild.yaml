steps:
  - name: gcr.io/cloud-builders/docker
    dir: eval
    args:
      - build
      - '-t'
      - 'europe-west1-docker.pkg.dev/$PROJECT_ID/codigollm-eval/app:$COMMIT_SHA'
      - '-t'
      - 'europe-west1-docker.pkg.dev/$PROJECT_ID/codigollm-eval/app:latest'
      - '.'
  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - 'europe-west1-docker.pkg.dev/$PROJECT_ID/codigollm-eval/app:$COMMIT_SHA'
  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - 'europe-west1-docker.pkg.dev/$PROJECT_ID/codigollm-eval/app:latest'
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - codigollm-eval
      - '--image=europe-west1-docker.pkg.dev/$PROJECT_ID/codigollm-eval/app:$COMMIT_SHA'
      - '--region=europe-west1'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--memory=512Mi'
      - '--cpu=1'
      - '--min-instances=0'
      - '--max-instances=10'
      - '--port=8080'

images:
  - 'europe-west1-docker.pkg.dev/$PROJECT_ID/codigollm-eval/app:$COMMIT_SHA'
  - 'europe-west1-docker.pkg.dev/$PROJECT_ID/codigollm-eval/app:latest'

options:
  logging: CLOUD_LOGGING_ONLY
